<button 
  (click)="toggleTheme()"
  class="w-11 h-11 flex items-center justify-center rounded-2xl bg-glass-bg border border-glass-border text-text-primary hover:bg-glass-bg-hover transition-all relative group shadow-sm focus:outline-none cursor-pointer"
  [title]="getToggleTitle()"
>
  <!-- Sun Icon (visible in Dark mode) -->
  <svg 
    *ngIf="showSunIcon()"
    class="w-5 h-5 animate-in fade-in zoom-in duration-500" 
    fill="none" viewBox="0 0 24 24" stroke="currentColor"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
  </svg>

  <!-- Moon Icon (visible in Light mode) -->
  <svg 
    *ngIf="showMoonIcon()"
    class="w-5 h-5 animate-in fade-in zoom-in duration-500" 
    fill="none" viewBox="0 0 24 24" stroke="currentColor"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
  </svg>
</button>
