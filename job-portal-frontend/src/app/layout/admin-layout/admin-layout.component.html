<!-- Aurora Mesh Backgrounds -->
<div class="blob-1"></div>
<div class="blob-2"></div>
<div class="blob-3"></div>
<div class="blob-4"></div>

<div class="flex min-h-screen relative z-0">

  <!-- Shared Shared Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="flex-1 ml-64 relative z-10 min-h-screen">
    
    <!-- Top Header Bar (Admin Specific Header) -->
    <header class="h-20 bg-glass-bg backdrop-blur-3xl border-b border-glass-border sticky top-0 z-50 flex items-center justify-between px-8">
      <div class="flex items-center gap-4">
        <h2 class="text-xs font-black text-text-muted uppercase tracking-[0.2em] opacity-40">Administrative Cloud</h2>
      </div>

      <div class="flex items-center gap-4">
        
        <!-- Refresh Data Button -->
        <button (click)="refreshData()" title="Refresh Data"
          class="w-11 h-11 flex items-center justify-center rounded-2xl bg-bg-secondary border border-glass-border text-text-secondary hover:bg-bg-primary hover:text-text-primary transition-all shadow-sm">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <app-theme-toggle></app-theme-toggle>
        <!-- Notification Bell -->
        <div class="relative notification-container">
          <button (click)="toggleNotifications($event)" 
            class="w-11 h-11 flex items-center justify-center rounded-2xl bg-bg-secondary border border-glass-border text-text-secondary hover:bg-bg-primary hover:text-text-primary transition-all relative group shadow-sm">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            @if (notificationService.unreadCount > 0) {
              <span class="absolute -top-1 -right-1 w-5 h-5 bg-royal-blue text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-lg animate-pulse">
                {{ notificationService.unreadCount }}
              </span>
            }
          </button>

          @if (isNotificationOpen) {
            <div class="absolute right-0 mt-4 z-[100] w-96 shadow-2xl animate-fade-in-up">
              <app-notification-panel></app-notification-panel>
            </div>
          }
        </div>

        <div class="flex items-center gap-3 pl-6 border-l border-glass-border">
          <div class="w-9 h-9 rounded-xl bg-bg-secondary text-text-primary border border-glass-border flex items-center justify-center font-bold text-xs">
            {{ authService.getCurrentUser()?.name?.charAt(0) }}
          </div>
          <div class="hidden xl:block">
            <p class="text-[10px] font-black text-text-secondary opacity-30 uppercase tracking-widest leading-none mb-1">System User</p>
            <p class="text-xs font-bold text-text-primary">{{ authService.getCurrentUser()?.name }}</p>
          </div>
        </div>
      </div>
    </header>

    <div class="p-10">
      <router-outlet />
    </div>
  </main>
</div>
