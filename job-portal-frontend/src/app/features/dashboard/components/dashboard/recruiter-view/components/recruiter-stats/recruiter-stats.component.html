<!-- Recruitment Insights -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
  <div class="celestial-card p-8 group overflow-hidden relative">
    <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-text-secondary mb-4 opacity-50">Live Job
      Postings</div>
    <div class="text-4xl font-bold text-text-primary mb-2">{{ myPostedJobs.length }}</div>
    <div class="h-1 w-8 bg-energy-emerald rounded-full"></div>
  </div>

  <div class="celestial-card p-8 group overflow-hidden relative border-none bg-slate-navy text-white transition-colors duration-500">
    <div class="relative z-10">
      <div class="text-[10px] font-bold uppercase tracking-[0.2em] mb-4 opacity-30 text-white">Application
        Velocity</div>
      <div class="flex items-end justify-between">
        <div>
          <div class="text-4xl font-bold mb-1">{{ totalAppsLast7Days }}</div>
          <div class="text-[9px] font-bold text-energy-indigo uppercase tracking-widest">Last 7 Days</div>
        </div>
        <!-- Sparkline (Velocity) -->
        <svg class="w-24 h-8 overflow-visible" viewBox="0 0 100 40">
          <path [attr.d]="'M ' + appVelocityPoints" fill="none" stroke="#a18cd1" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" class="drop-shadow-[0_0_8px_rgba(161,140,209,0.5)]" />
        </svg>
      </div>
    </div>
  </div>

  <div class="celestial-card p-8">
    <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-text-secondary mb-4 opacity-50">Awaiting
      Review</div>
    <div class="text-4xl font-bold text-text-primary mb-2">{{ pendingApplications.length }}</div>
    <div class="h-1 w-8 bg-energy-violet rounded-full"></div>
  </div>

  <div class="celestial-card p-8">
    <div class="text-[10px] font-bold uppercase tracking-[0.2em] text-text-secondary mb-4 opacity-50">Conversion
      Rate</div>
    <div class="text-4xl font-bold text-text-primary mb-2">
      {{ (recentApplicationsForJobs.length > 0 ? (interviewCount / recentApplicationsForJobs.length *
      100).toFixed(0) : '0') }}%
    </div>
    <div class="h-1 w-8 bg-energy-indigo rounded-full"></div>
  </div>
</div>
