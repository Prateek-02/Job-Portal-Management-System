<!-- ── RECRUITMENT PERSPECTIVE ───────────────────────── -->
<div class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 mb-8 animate-fade-in-up">
  <div>
    <h1 class="text-2xl font-bold text-text-primary tracking-tighter mb-2">{{ getDashboardTitle() }}</h1>
    <p class="text-sm font-medium text-text-secondary opacity-70">{{ getDashboardSubtitle() }}</p>
  </div>
  @if (shouldShowCta()) {
  <a [routerLink]="getCreateJobRoute()"
    class="btn-celestial py-3 px-6 text-xs shadow-xl hover:scale-105 transition-all">
    {{ getCtaLabel() }}
  </a>
  }
</div>

<!-- Recruitment Insights Stats -->
<app-recruiter-stats></app-recruiter-stats>

<!-- Quick Review & Market Pulse Section -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
  <!-- Quick Review Deck -->
  <div class="lg:col-span-2">
    <app-quick-review-queue></app-quick-review-queue>
  </div>

  <!-- Market Pulse Widget -->
  <div class="lg:col-span-1">
    <app-market-pulse-helper></app-market-pulse-helper>
  </div>
</div>

<!-- Job Postings Table -->
<app-recent-postings-table></app-recent-postings-table>

<!-- Recent Candidates Table -->
<app-recent-candidates-table></app-recent-candidates-table>
