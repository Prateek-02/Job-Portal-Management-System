<!-- ── SOPHISTICATED SIDEBAR ─────────────────────────────── -->
<aside class="lg:w-[280px] shrink-0 animate-fade-in-up">
  <div class="celestial-card p-6 flex flex-col items-center text-center sticky top-28 inner-glow min-h-[400px]">

    <!-- User Profile Section -->
    <div class="relative mb-5">
      <div class="w-20 h-20 rounded-full p-1 shadow-xl relative z-10"
        style="background: linear-gradient(135deg, var(--energy-sphere-color), var(--color-energy-indigo))">
        <div
          class="w-full h-full rounded-full bg-bg-primary flex items-center justify-center text-text-primary font-bold text-2xl shadow-inner">
          {{ getInitial() }}
        </div>
      </div>
      <!-- Decorative Energy Ring -->
      <div class="absolute -inset-1 opacity-20 blur-lg rounded-full animate-pulse"
        style="background: var(--energy-sphere-color)"></div>
    </div>

    <h2 class="text-lg font-bold text-text-primary mb-0.5">{{ getDisplayName() }}</h2>
    <p class="text-[13px] font-semibold text-text-secondary opacity-60 mb-5 text-center break-all w-full">{{ user?.email }}</p>

    <div
      class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[9px] font-bold uppercase tracking-[0.2em] bg-bg-secondary text-text-primary mb-6 shadow-md border border-glass-border">
      {{ getRoleLabel() }}
    </div>

    <!-- Dashboard Navigation -->
    <div class="w-full space-y-1 text-left border-t border-glass-border pt-6 mt-2">
      @if (isJobSeeker) {
      <a routerLink="/applications/my-applications"
        routerLinkActive="!bg-royal-blue/10 !text-royal-blue !border-royal-blue/40"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-[13px] font-bold text-text-secondary hover:bg-bg-secondary hover:text-text-primary transition-all border border-transparent">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        My Applications
      </a>
      } @else if (isRecruiter) {
      <a routerLink="/jobs/my-postings" routerLinkActive="!bg-royal-blue/10 !text-royal-blue !border-royal-blue/40"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-[13px] font-bold text-text-secondary hover:bg-bg-secondary hover:text-text-primary transition-all border border-transparent">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        My Job Postings
      </a>
      }

      <a routerLink="/profile" routerLinkActive="!bg-royal-blue/10 !text-royal-blue !border-royal-blue/40"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-[13px] font-bold text-text-secondary hover:bg-bg-secondary hover:text-text-primary transition-all border border-transparent">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Profile Settings
      </a>
    </div>
  </div>
</aside>
