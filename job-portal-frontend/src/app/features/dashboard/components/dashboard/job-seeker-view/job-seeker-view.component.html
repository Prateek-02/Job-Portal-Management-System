<!-- ── JOB SEEKER PERSPECTIVE ─────────────────────────── -->
<div class="mb-6">
  <h1 class="text-2xl font-bold text-text-primary tracking-tighter mb-2">Hello, {{ getFirstName() }}</h1>
  <p class="text-[14px] font-medium text-text-secondary opacity-70">{{ getSubtitle() }}
  </p>
</div>

<!-- Application Stats -->
<app-job-seeker-stats></app-job-seeker-stats>

<div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8 items-start">
  <!-- Recommended Jobs (Left Column) -->
  <div class="xl:col-span-2">
    <app-recommended-jobs></app-recommended-jobs>
  </div>

  <!-- Recent Activity (Right Column) -->
  <div class="xl:col-span-1">
    <app-recent-activity></app-recent-activity>
  </div>
</div>

<!-- Job Market Insights -->
<app-market-pulse></app-market-pulse>
