<div class="w-full px-4 lg:px-8 pt-2 pb-8 relative z-20">
  <div class="flex flex-col lg:flex-row gap-10">

    <!-- Sidebar Component -->
    <app-dashboard-sidebar
      [user]="user"
      [isJobSeeker]="isJobSeeker"
      [isRecruiter]="isRecruiter">
    </app-dashboard-sidebar>

    <!-- Main Content Area -->
    <div class="flex-1 min-w-0 animate-fade-in-up">
      
      <!-- Job Seeker Dashboard View -->
      @if (isJobSeeker) {
        <app-job-seeker-view [user]="user"></app-job-seeker-view>
      }

      <!-- Recruiter Dashboard View -->
      @if (isRecruiter) {
        <app-recruiter-view></app-recruiter-view>
      }
      
    </div>
  </div>
</div>
