<div class="w-full max-w-md mx-auto animate-fade-in-up py-20">
  <div class="celestial-card p-10 md:p-12 inner-glow overflow-hidden relative">
    
    <!-- Decorative Aura Accent -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-energy-indigo/10 blur-[60px] rounded-full pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center mb-12 relative z-10">
      <div class="w-16 h-16 bg-obsidian rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-2xl">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-obsidian mb-2 tracking-tighter">Sign In</h1>
      <p class="text-sm font-bold text-text-secondary opacity-60 uppercase tracking-widest">Access Your Profile</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage) {
      <div class="mb-8 p-4 rounded-2xl bg-red-500/5 border border-red-500/20 text-red-600 text-[13px] font-bold flex items-start gap-3 animate-fade-in">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6 relative z-10">
      <!-- Email -->
      <div class="space-y-2">
        <label class="text-[11px] font-bold text-obsidian/40 uppercase tracking-[0.2em] ml-1" for="email">Email Address</label>
        <div class="relative">
          <input id="email" type="email" formControlName="email" 
            class="w-full px-6 py-4 bg-obsidian/[0.03] border border-glass-border rounded-2xl text-obsidian font-bold placeholder:text-obsidian/20 focus:bg-white focus:border-energy-indigo/40 focus:ring-4 focus:ring-energy-indigo/5 transition-all outline-none" 
            placeholder="email@example.com">
        </div>
        @if (email?.touched && email?.invalid) {
          <p class="text-[10px] font-bold text-red-500 ml-1 uppercase tracking-wider">Invalid email entry</p>
        }
      </div>

      <!-- Password -->
      <div class="space-y-2">
        <div class="flex items-center justify-between ml-1">
          <label class="text-[11px] font-bold text-obsidian/40 uppercase tracking-[0.2em]" for="password">Password</label>
          <a routerLink="/auth/forgot-password" class="text-[11px] font-bold text-energy-indigo hover:opacity-70 transition-opacity uppercase tracking-wider">Forgot Password?</a>
        </div>
        <div class="relative">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" 
            class="w-full px-6 py-4 bg-obsidian/[0.03] border border-glass-border rounded-2xl text-obsidian font-bold placeholder:text-obsidian/20 focus:bg-white focus:border-energy-indigo/40 focus:ring-4 focus:ring-energy-indigo/5 transition-all outline-none" 
            placeholder="••••••••">
          <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-4 flex items-center text-obsidian/30 hover:text-obsidian transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              @if (showPassword) { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /> } 
              @else { <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /> }
            </svg>
          </button>
        </div>
        @if (password?.touched && password?.invalid) {
          <p class="text-[10px] font-bold text-red-500 ml-1 uppercase tracking-wider">Password requirement not met</p>
        }
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="isLoading" class="btn-celestial w-full !py-5 !rounded-2xl shadow-xl mt-4">
        @if (isLoading) {
          <svg class="animate-spin h-5 w-5 text-white mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="mt-10 text-center relative z-10">
      <p class="text-sm font-bold text-text-secondary opacity-60 mb-2">New to TalentSphere?</p>
      <a routerLink="/auth/signup" class="text-sm font-bold text-obsidian hover:text-energy-indigo transition-colors">Create New Account →</a>
    </div>
  </div>
</div>
