# =====================================================
# Server Configuration
# =====================================================
server.port=8085
spring.application.name=api-gateway
spring.main.web-application-type=reactive

# =====================================================
# Gateway Timeouts (Global)
# =====================================================
# Support large file uploads and slow service responses
spring.cloud.gateway.httpclient.response-timeout=60s
spring.cloud.gateway.httpclient.connect-timeout=10000

# =====================================================
# Eureka Configuration
# =====================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# =====================================================
# Actuator
# =====================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,env,beans,prometheus

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Logging pattern (ADD THIS)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# =====================================================
# JWT Secret
# =====================================================
jwt.secret=${JWT_SECRET}

#FRONTEND URL
frontend.url=${FRONTEND_URL:http://localhost:4200,https://talentsphere.me,https://www.talentsphere.me,https://witty-sky-0345e8a00.2.azurestaticapps.net}


# =====================================================
# PUBLIC ROUTES - NO AUTHENTICATION REQUIRED
# =====================================================

# AUTH SERVICE - PUBLIC
spring.cloud.gateway.routes[0].id=auth-register
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/register

spring.cloud.gateway.routes[1].id=auth-login
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/login

spring.cloud.gateway.routes[2].id=auth-public-ops
spring.cloud.gateway.routes[2].uri=lb://auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/forgot-password,/api/auth/reset-password,/api/auth/refresh

# ADMIN SERVICE - PUBLIC (STATS)
spring.cloud.gateway.routes[3].id=admin-public-stats
spring.cloud.gateway.routes[3].uri=lb://admin-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/public/**

# =====================================================
# PROTECTED ROUTES - AUTHENTICATION REQUIRED
# =====================================================

# JOB SERVICE - PROTECTED (COMMANDS)
spring.cloud.gateway.routes[4].id=job-service-protected
spring.cloud.gateway.routes[4].uri=lb://job-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/jobs/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=RateLimitingFilter

# APPLICATION SERVICE - PROTECTED
spring.cloud.gateway.routes[5].id=application-service
spring.cloud.gateway.routes[5].uri=lb://application-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/applications/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[5].filters[1]=RateLimitingFilter

# ADMIN SERVICE - PROTECTED
spring.cloud.gateway.routes[6].id=admin-service
spring.cloud.gateway.routes[6].uri=lb://admin-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[6].filters[1]=RateLimitingFilter

# NOTIFICATION SERVICE - PROTECTED
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://notification-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[7].filters[1]=RateLimitingFilter

# AUTH SERVICE - PROTECTED
spring.cloud.gateway.routes[8].id=auth-service-protected
spring.cloud.gateway.routes[8].uri=lb://auth-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/auth/profile,/api/auth/users/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[8].filters[1]=RateLimitingFilter

# =====================================================
# REDIS CONFIGURATION
# =====================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

# =====================================================
# RATE LIMITING CONFIGURATION
# =====================================================
# Enable/disable rate limiting
ratelimit.enabled=true

# Maximum requests per time window
ratelimit.max-requests=100

# Time window in seconds
ratelimit.time-window-seconds=60

# Enable rate limiting per user ID (for authenticated requests)
ratelimit.enable-user-limit=true

# Enable rate limiting per IP address
ratelimit.enable-ip-limit=true

# Enable rate limiting per API key
ratelimit.enable-apikey-limit=true