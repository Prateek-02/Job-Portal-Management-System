# Server
server.port=8083
spring.application.name=application-service

# =====================================================
# Multipart Configuration
# =====================================================
# Support up to 10MB resumes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/job_portal_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================
# Internal Configuration
# =====================================================
internal.secret=${INTERNAL_SECRET}


# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Queue Names
rabbitmq.queue.job.applied=email.job-applied
rabbitmq.queue.application.status=email.application-status

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.applicationAuthService.register-health-indicator=true
resilience4j.circuitbreaker.instances.applicationAuthService.sliding-window-size=10
resilience4j.circuitbreaker.instances.applicationAuthService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.applicationAuthService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.applicationAuthService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.applicationAuthService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.applicationAuthService.ignore-exceptions=feign.FeignException.NotFound

resilience4j.circuitbreaker.instances.applicationJobService.register-health-indicator=true
resilience4j.circuitbreaker.instances.applicationJobService.sliding-window-size=10
resilience4j.circuitbreaker.instances.applicationJobService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.applicationJobService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.applicationJobService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.applicationJobService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.applicationJobService.ignore-exceptions=feign.FeignException.NotFound

resilience4j.timelimiter.instances.applicationAuthService.timeout-duration=45s
resilience4j.timelimiter.instances.applicationJobService.timeout-duration=45s



# Feign
spring.cloud.openfeign.cache.enabled=false

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,env,beans,circuitbreakers,prometheus

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

# Logging pattern (ADD THIS)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]