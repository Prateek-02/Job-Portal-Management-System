# Server
server.port=8084
spring.application.name=admin-service

# =====================================================
# Internal Configuration
# =====================================================
internal.secret=${INTERNAL_SECRET}

# =====================================================
# Eureka
# =====================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# =====================================================
# RabbitMQ Configuration
# =====================================================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# =====================================================
# Circuit Breaker (Resilience4j)
# =====================================================
resilience4j.circuitbreaker.instances.adminAuthService.register-health-indicator=true
resilience4j.circuitbreaker.instances.adminAuthService.sliding-window-size=10
resilience4j.circuitbreaker.instances.adminAuthService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.adminAuthService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adminAuthService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adminAuthService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.adminAuthService.ignore-exceptions=feign.FeignException.NotFound

resilience4j.circuitbreaker.instances.adminJobService.register-health-indicator=true
resilience4j.circuitbreaker.instances.adminJobService.sliding-window-size=10
resilience4j.circuitbreaker.instances.adminJobService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.adminJobService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adminJobService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adminJobService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.adminJobService.ignore-exceptions=feign.FeignException.NotFound

resilience4j.circuitbreaker.instances.adminApplicationService.register-health-indicator=true
resilience4j.circuitbreaker.instances.adminApplicationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.adminApplicationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.adminApplicationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adminApplicationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adminApplicationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.adminApplicationService.ignore-exceptions=feign.FeignException.NotFound

# =====================================================
# Time Limiter (Resilience4j)
# =====================================================
resilience4j.timelimiter.instances.adminAuthService.timeout-duration=10s
resilience4j.timelimiter.instances.adminAuthService.cancel-running-future=true

resilience4j.timelimiter.instances.adminJobService.timeout-duration=10s
resilience4j.timelimiter.instances.adminJobService.cancel-running-future=true

resilience4j.timelimiter.instances.adminApplicationService.timeout-duration=10s
resilience4j.timelimiter.instances.adminApplicationService.cancel-running-future=true

# =====================================================
# Feign Client Configuration
# =====================================================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.default-to-properties=false

# =====================================================
# Actuator
# =====================================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,env,beans,circuitbreakers

# Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
# Logging pattern (ADD THIS)
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]